# Nginx HTTPS Reverse Proxy & IP Allowlist Configuration (Phase 2 Task 8)
server {
    listen 80;
    server_name voice-pbx.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name voice-pbx.example.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Webhook IP Allowlist & Security Headers
    location /api/webhook/ {
        allow 127.0.0.1;
        allow ::1;
        # Add PBX / SIP Trunk IPs below:
        # allow 198.51.100.0/24;
        # deny all;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Shared-Secret $http_x_shared_secret;
        proxy_set_header X-Webhook-Signature $http_x_webhook_signature;
        proxy_set_header X-Idempotency-Key $http_x_idempotency_key;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
